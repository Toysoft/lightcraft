[package]
name = "eidos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "eidos"

[lints]
workspace = true

[features]
default = []
# Open HEIC/HEIF photos (the optional eidos-heif crate). Not default so distributors choose
# it (HEVC patents); build with `--features heif` to include it.
heif = ["eidos-codecs/heif"]

[dependencies]
eidos-engine = { workspace = true, features = ["sam"] }
eidos-sysmem = { workspace = true }
eidos-ui-egui = { workspace = true }
eidos-codecs = { workspace = true }
eidos-raster = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for eidos.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { workspace = true }
