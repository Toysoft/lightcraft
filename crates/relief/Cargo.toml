[package]
name = "lightcraft-relief"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "LightCraft scene geometry: MoGe-2 monocular surface normals and depth in pure Rust (L3)"

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
log = { workspace = true }

# the model runs natively only (the web build relights from the stored geometry)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
candle-core = { workspace = true }
candle-nn = { workspace = true }
lightcraft-fetch = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["metal"] }
candle-nn = { workspace = true, features = ["metal"] }

[dev-dependencies]
image = { workspace = true }
