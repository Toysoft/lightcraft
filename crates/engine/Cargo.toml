[package]
name = "eidos-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Eidos engine: session, command registry, history, render jobs, view-models (L4)"

[lints]
workspace = true

[dependencies]
eidos-geom = { workspace = true }
eidos-color = { workspace = true }
eidos-raster = { workspace = true }
eidos-develop = { workspace = true }
eidos-scenes = { workspace = true }
eidos-pipeline = { workspace = true }
eidos-gpu = { workspace = true }
eidos-catalog = { workspace = true }
web-time = { workspace = true }
eidos-preview = { workspace = true }
eidos-codecs = { workspace = true }
eidos-raw = { workspace = true }
eidos-meta = { workspace = true }
eidos-faces = { workspace = true }
miniz_oxide = { workspace = true }
eidos-merge = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
ab_glyph = { workspace = true }
# Apply the font’s vertical substitutions and origins to Japanese watermarks.
harfrust = { version = "0.12", default-features = false, features = ["std"] }
unicode-segmentation = "1.13"
eidos-segment = { workspace = true, optional = true }

# model downloads run natively only (the web build fetches no models)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eidos-fetch = { workspace = true }

[features]
# AI masks with SAM 3 (Object / Describe). Off for the web and CLI builds.
sam = ["dep:eidos-segment"]

[dev-dependencies]
libc = { workspace = true }
eidos-tiff = { workspace = true }
