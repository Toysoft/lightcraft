# Continuous integration: run `cargo xtask ci` (the project's one quality gate, see AGENTS.md)
# on Linux and Windows x64. Only FreeBSD runs `cargo test` today; this adds the two main platforms.
# The jobs are independent and run in parallel; neither is `needs:`-gated on the other.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**.rs"
      - "**.toml"
      - "**.lock"
      # `cargo xtask ci` also runs the assets and parity gates, which read these:
      - "assets/**"
      - docs/parity-checklist.md
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUST_TEST_THREADS: "4"

jobs:
  linux-x64:
    name: Linux x86_64 (build + test)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fonts (optional build input; required in CI): see craftrules standards/fonts.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: 8dcdacd5153e64560d109541a47d806f26f048c0
          path: craft-fonts
      # `cargo xtask ci` ends with the wasm32 check, so the target must be installed or the
      # step fails with "can't find crate for `std`" (the same reason release.yml sets it).
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-linux-x64-${{ hashFiles('Cargo.lock') }}
      # Only what building and testing the workspace needs: the X11/Wayland/GL and
      # fontconfig/freetype headers for egui/winit. The packaging tools release.yml needs
      # (desktop-file-validate, appstreamcli, zsyncmake) are not run by `cargo xtask ci`.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            pkg-config libfontconfig1-dev libfreetype6-dev
      - name: Run cargo xtask ci
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
        run: cargo xtask ci

  windows-x64:
    name: Windows x86_64 (build + test)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fonts (optional build input; required in CI): see craftrules standards/fonts.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: 8dcdacd5153e64560d109541a47d806f26f048c0
          path: craft-fonts
      # `cargo xtask ci` ends with the wasm32 check, so the target must be installed or the
      # step fails with "can't find crate for `std`" (the same reason release.yml sets it).
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-windows-x64-${{ hashFiles('Cargo.lock') }}
      # No system dependencies: the X11/Wayland/GL and fontconfig headers Linux needs have no
      # Windows equivalent here, and the HEIF decoder is pure Rust (heic-rs), so unlike Linux
      # there is nothing to install. MSVC, freetype and fontconfig are part of the toolchain.
      - name: Run cargo xtask ci
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
          # Off the workspace by default: the runner's checkout path is already long and MSVC
          # hits the 260-character limit, which cargo's deep target/ paths can exceed.
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
        run: cargo xtask ci